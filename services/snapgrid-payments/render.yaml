services:
  - type: web
    name: snapgrid-payments
    runtime: node
    plan: starter
    region: ohio
    rootDir: services/snapgrid-payments
    buildCommand: npm ci
    preDeployCommand: npm run migrate
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: off
    domains:
      - pay.snapgrid.eb28.co
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: snapgrid-payments-db
          property: connectionString
      - key: SOLANA_RPC_URL
        sync: false
      - key: SNAPGRID_ORDER_SECRET
        generateValue: true

databases:
  - name: snapgrid-payments-db
    plan: basic-256mb
    region: ohio
    databaseName: snapgrid_payments
    user: snapgrid_payments
